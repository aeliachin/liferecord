<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>玥玥作息</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#06284d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#3b2b20;}
    body{display:flex;justify-content:center;align-items:flex-start;}
    .app{width:min(100vw,430px);min-height:100vh;background:#06284d;}
    .screen{position:relative;width:100%;overflow:hidden;background:#06284d;}
    .screen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}

    /* 只用于把其它页面里的“生活记录”盖成“玥玥作息”。水页原图已是玥玥作息，所以不显示覆盖层。 */
    .title-cover{position:absolute;z-index:6;display:none;align-items:center;justify-content:center;text-align:center;color:#4a392b;font-family:"Hannotate SC","KaiTi","STKaiti","STSong",serif;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 0 rgba(255,255,255,.25);background:#ead8bd;border-radius:18px 16px 14px 17px;box-shadow:0 10px 22px rgba(0,0,0,.32);transform:rotate(-2deg);border:1px solid rgba(89,61,36,.18);}
    .title-cover::before{content:"";position:absolute;inset:-7px -8px;background:radial-gradient(circle at 10px 4px, transparent 0 7px, #ead8bd 8px) 0 0/25px 16px repeat-x, radial-gradient(circle at 10px 12px, transparent 0 7px, #ead8bd 8px) 0 100%/25px 16px repeat-x;z-index:-1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.12));}
    .title-cover::after{content:"⭐";position:absolute;right:-17px;top:-19px;font-size:clamp(16px,5vw,27px);filter:drop-shadow(0 3px 2px rgba(0,0,0,.26));}
    .screen.needs-title .title-cover{display:flex;}
    .screen:not(.water) .title-cover{left:28.5%;top:1.2%;width:42%;height:7.7%;font-size:clamp(24px,8vw,48px);}

    .hot{position:absolute;z-index:10;background:rgba(0,0,0,0);border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .hot:focus{outline:none}
    .top-tabs{position:absolute;z-index:9;left:5%;top:10.7%;width:90%;height:6.2%;display:grid;grid-template-columns:repeat(5,1fr);}
    .bottom-tabs{position:absolute;z-index:9;left:3.2%;bottom:1.0%;width:93.6%;height:8.2%;display:grid;grid-template-columns:repeat(5,1fr);}
    .top-tabs button,.bottom-tabs button{background:rgba(0,0,0,0);border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .upload-hit{left:73.5%;top:1.4%;width:23.5%;height:4.2%;}
    .export-hit{left:73.5%;top:5.9%;width:23.5%;height:4.2%;}
    .notice{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(18px);opacity:0;background:rgba(35,24,16,.92);color:#fff8e9;padding:10px 14px;border-radius:999px;font-size:13px;z-index:99;transition:.18s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.26);}
    .notice.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <main class="app">
    <section class="screen water" id="screen">
      <img id="pageImage" src="assets/page-water.png" alt="玥玥作息静态复刻页面" />
      <div class="title-cover">玥玥作息</div>
      <button class="hot upload-hit" id="uploadBtn" aria-label="上传数据"></button>
      <button class="hot export-hit" id="exportBtn" aria-label="导出数据"></button>
      <div class="top-tabs" aria-label="顶部页面切换">
        <button data-page="water" aria-label="喝水"></button>
        <button data-page="sleep" aria-label="睡眠"></button>
        <button data-page="exercise" aria-label="运动"></button>
        <button data-page="period" aria-label="周期"></button>
        <button data-page="stats" aria-label="统计"></button>
      </div>
      <div class="bottom-tabs" aria-label="底部页面切换">
        <button data-page="water" aria-label="喝水"></button>
        <button data-page="sleep" aria-label="睡眠"></button>
        <button data-page="exercise" aria-label="运动"></button>
        <button data-page="period" aria-label="周期"></button>
        <button data-page="stats" aria-label="统计"></button>
      </div>
    </section>
  </main>
  <div class="notice" id="notice"></div>
<script>
  const pages = {
    water: 'assets/page-water.png',
    sleep: 'assets/page-sleep.png',
    exercise: 'assets/page-exercise.png',
    period: 'assets/page-period.png',
    stats: 'assets/page-stats.png'
  };
  const screen = document.getElementById('screen');
  const img = document.getElementById('pageImage');
  function showPage(page){
    img.src = pages[page];
    screen.className = 'screen ' + page + (page === 'water' ? '' : ' needs-title');
    window.scrollTo({top:0,behavior:'instant'});
  }
  document.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page)));
  const notice = document.getElementById('notice');
  function toast(text){notice.textContent=text;notice.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>notice.classList.remove('show'),1700)}
  document.getElementById('uploadBtn').addEventListener('click',()=>toast('静态复刻版：此按钮只做视觉展示'));
  document.getElementById('exportBtn').addEventListener('click',()=>toast('静态复刻版：此按钮只做视觉展示'));
</script>
</body>
</html>
