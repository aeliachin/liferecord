<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>玥玥作息</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#66cfc2">
  <style>
    :root{
      --bg:#eefaf8;
      --bg2:#f7fffd;
      --main:#66cfc2;
      --main-dark:#239e91;
      --main-soft:#d9f6f1;
      --blue:#4b9ee8;
      --purple:#8e7ae6;
      --orange:#ffb25b;
      --pink:#ff8aa0;
      --green:#83c96f;
      --text:#1f2d2f;
      --muted:#738284;
      --card:#ffffff;
      --line:#dcefed;
      --shadow:0 14px 30px rgba(32,140,128,.12);
      --radius:22px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:
      radial-gradient(circle at 12% 2%,#d6fbf5 0,#eefaf8 42%,#f7fffd 100%);
      background-attachment:fixed;
    }
    body{padding-bottom:calc(92px + var(--safe-bottom))}
    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer;color:inherit;background:none}
    .app{width:min(820px,100%);margin:0 auto;padding:18px 16px 0}
    .header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
    .brand h1{margin:0;font-size:32px;letter-spacing:-.5px}
    .brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .pill{border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(31,120,112,.08);font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.9)}
    .pill.primary{background:var(--main);color:#fff}
    .nav{display:flex;gap:8px;overflow:auto;margin:10px -2px 16px;padding:2px 2px 6px}
    .nav button{white-space:nowrap;padding:10px 15px;border-radius:999px;background:#fff;color:#5d6b6d;box-shadow:0 6px 16px rgba(31,120,112,.08);font-weight:800;border:1px solid #edf7f5}
    .nav button.active{background:var(--main);color:#fff}
    .view{display:none}
    .view.active{display:block}
    .hero{background:linear-gradient(135deg,#ffffff,#e5fbf7);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
    .hero h2{margin:0 0 8px;font-size:24px}
    .hero p{margin:0;color:var(--muted);line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .entry{position:relative;overflow:hidden;text-align:left;border-radius:26px;background:#fff;padding:18px;box-shadow:var(--shadow);border:1px solid #eff8f6;min-height:132px}
    .entry .icon{font-size:32px;margin-bottom:10px}
    .entry h3{margin:0 0 6px;font-size:20px}
    .entry p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
    .entry:after{content:"";position:absolute;right:-18px;bottom:-18px;width:84px;height:84px;border-radius:50%;background:var(--main-soft)}
    .entry.water:after{background:#d8f4ff}.entry.sleep:after{background:#ece8ff}.entry.exercise:after{background:#edf8df}.entry.period:after{background:#ffe9ef}.entry.stats:after{background:#fff0d8}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .summary{background:#fff;border-radius:22px;padding:15px;box-shadow:var(--shadow);border:1px solid #edf7f5}
    .summary span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
    .summary strong{font-size:24px;letter-spacing:-.5px}
    .card{background:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow);border:1px solid #edf7f5;margin-bottom:14px}
    .card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .card-title h3{margin:0;font-size:20px}
    .muted{color:var(--muted);font-size:13px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:13px;color:#557173;font-weight:800;margin:0 0 6px 3px}
    .input,.select,textarea{width:100%;border:1.5px solid var(--line);background:#fbfffe;border-radius:16px;padding:12px 13px;outline:none;color:var(--text)}
    textarea{min-height:76px;resize:vertical}
    .input:focus,.select:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 4px rgba(102,207,194,.16)}
    .btn{padding:12px 14px;border-radius:16px;background:var(--main);color:#fff;font-weight:900;box-shadow:0 8px 18px rgba(35,158,145,.18)}
    .btn.secondary{background:#fff;color:var(--main-dark);border:1px solid var(--line);box-shadow:none}
    .btn.danger{background:#fff1f4;color:#cc3c58;box-shadow:none;border:1px solid #ffd6df}
    .btn.small{padding:8px 11px;border-radius:12px;font-size:13px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:9px 12px;border-radius:999px;background:#f4fbfa;color:#557173;font-weight:800;border:1px solid var(--line)}
    .chip.active{background:var(--main);color:#fff;border-color:var(--main)}
    .record-list{display:flex;flex-direction:column;gap:9px}
    .record{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f8fffd;border:1px solid var(--line);border-radius:18px;padding:12px}
    .record b{display:block;margin-bottom:3px}
    .record small{color:var(--muted);line-height:1.4}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .month-title{font-weight:900;font-size:18px}
    .calendar,.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
    .weekdays div{text-align:center;font-size:12px;color:var(--muted);font-weight:800}
    .day{aspect-ratio:1/1;border-radius:15px;background:#f8fffd;border:1px solid var(--line);font-weight:800;position:relative}
    .day.blank{background:transparent;border:0}
    .day.today{box-shadow:inset 0 0 0 2px var(--main)}
    .day.has{background:#e9fbf7}
    .day .dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
    .dot{width:5px;height:5px;border-radius:50%;background:var(--main)}
    .dot.head{background:var(--orange)}.dot.sleepbad{background:var(--purple)}
    .chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .chart-card{background:#fff;border:1px solid #edf7f5;border-radius:24px;padding:15px;box-shadow:var(--shadow)}
    .chart-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px}
    .bar-chart{height:180px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:0 4px 8px}
    .bar-wrap{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%}
    .bar{width:100%;max-width:32px;background:var(--main);border-radius:10px 10px 4px 4px;min-height:3px}
    .bar-label{font-size:11px;color:var(--muted);margin-top:6px}
    .line-list{display:flex;flex-direction:column;gap:8px}
    .line-item{display:grid;grid-template-columns:80px 1fr 50px;gap:8px;align-items:center;font-size:13px}
    .progress{height:10px;background:#edf8f6;border-radius:999px;overflow:hidden}
    .progress i{display:block;height:100%;background:var(--main);border-radius:999px}
    .bottom-nav{position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);width:min(820px,calc(100% - 18px));background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 32px rgba(32,140,128,.18);border-radius:25px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;z-index:20}
    .bottom-nav button{height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#6a7779;font-weight:800;font-size:12px}
    .bottom-nav button .ico{font-size:20px}
    .bottom-nav button.active{background:var(--main);color:#fff}
    .modal{position:fixed;inset:0;display:none;background:rgba(18,34,36,.32);z-index:50;align-items:flex-end;justify-content:center;padding:14px}
    .modal.active{display:flex}
    .sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.16)}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .sheet-head h3{margin:0}
    .close{width:36px;height:36px;border-radius:50%;background:#eef8f6;font-weight:900}
    .hidden-file{display:none}
    .notice{font-size:13px;color:var(--muted);line-height:1.5}
    @media(max-width:620px){
      .header{flex-direction:column}.top-actions{justify-content:flex-start}
      .home-grid,.grid,.chart-grid{grid-template-columns:1fr}
      .summary-grid{grid-template-columns:repeat(2,1fr)}
      .form-grid{grid-template-columns:1fr}
    }
    @media(max-width:390px){
      .app{padding-left:12px;padding-right:12px}
      .brand h1{font-size:28px}
      .summary-grid{grid-template-columns:1fr}
      .bottom-nav button{height:52px}
    }
  </style>
</head>
<body>
<input id="importFile" class="hidden-file" type="file" accept=".json,application/json">
<div class="app">
  <header class="header">
    <div class="brand">
      <h1>玥玥作息</h1>
      <p>本地保存，适合 iPhone 主屏幕使用</p>
    </div>
    <div class="top-actions">
      <button class="pill" id="backupBtn">备份</button>
      <button class="pill primary" id="exportBtn">导出数据</button>
      <button class="pill" id="importBtn">上传数据</button>
    </div>
  </header>
  <nav class="nav" id="topNav"></nav>
  <main id="main"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head"><h3 id="modalTitle">记录</h3><button class="close" id="closeModal">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STORE_KEY='yueyue_lesson_style_v1';
const pages=[
  {id:'home',name:'首页',icon:'🏠'},
  {id:'water',name:'喝水',icon:'💧'},
  {id:'sleep',name:'睡眠',icon:'🌙'},
  {id:'exercise',name:'运动',icon:'⛰️'},
  {id:'period',name:'周期',icon:'🌸'},
  {id:'stats',name:'统计',icon:'📊'}
];
const bottomPages=pages.filter(p=>p.id!=='home');
const exerciseTypes=['爬坡','散步','拉伸','跑步'];
let current='home';
let calendarDate=new Date();
let selectedExerciseType='爬坡';
let selectedPeriodDate=null;
let statRange='week';
let statCursor=new Date();
let data=loadData();

function defaultData(){return {version:'yueyue_lesson_style_v1',water:[],sleep:[],exercise:[],period:[],settings:{waterGoal:2000}}}
function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return defaultData();
    const x=JSON.parse(raw);
    return {...defaultData(),...x,settings:{...defaultData().settings,...(x.settings||{})},
      water:Array.isArray(x.water)?x.water:[],sleep:Array.isArray(x.sleep)?x.sleep:[],exercise:Array.isArray(x.exercise)?x.exercise:[],period:Array.isArray(x.period)?x.period:[]};
  }catch(e){return defaultData()}
}
function saveData(){localStorage.setItem(STORE_KEY,JSON.stringify(data))}
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function today(){return dateKey(new Date())}
function timeKey(d=new Date()){return `${dateKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function parseDate(s){const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)}
function fmtDate(s){const d=parseDate(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function betweenKey(itemDate,start,end){const d=parseDate(itemDate);return d>=start&&d<=end}
function rangeBounds(){
  const c=statCursor;
  if(statRange==='week'){const s=startOfWeek(c);return [s,addDays(s,6),`${fmtDate(dateKey(s))} - ${fmtDate(dateKey(addDays(s,6)))}`]}
  if(statRange==='month'){const s=new Date(c.getFullYear(),c.getMonth(),1), e=new Date(c.getFullYear(),c.getMonth()+1,0);return [s,e,`${c.getFullYear()}年${c.getMonth()+1}月`]}
  if(statRange==='quarter'){const q=Math.floor(c.getMonth()/3);const s=new Date(c.getFullYear(),q*3,1), e=new Date(c.getFullYear(),q*3+3,0);return [s,e,`${c.getFullYear()}年第${q+1}季度`]}
  const s=new Date(c.getFullYear(),0,1), e=new Date(c.getFullYear(),11,31);return [s,e,`${c.getFullYear()}年`]
}

function init(){
  document.getElementById('topNav').innerHTML=pages.map(p=>`<button data-page="${p.id}">${p.name}</button>`).join('');
  document.getElementById('bottomNav').innerHTML=bottomPages.map(p=>`<button data-page="${p.id}"><span class="ico">${p.icon}</span><span>${p.name}</span></button>`).join('');
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
  document.getElementById('exportBtn').onclick=exportData;
  document.getElementById('backupBtn').onclick=()=>openBackup();
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=importData;
  document.getElementById('closeModal').onclick=closeModal;
  document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
  showPage('home');
}
function showPage(page){
  current=page;
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const main=document.getElementById('main');
  if(current==='home') main.innerHTML=renderHome();
  if(current==='water') main.innerHTML=renderWater();
  if(current==='sleep') main.innerHTML=renderSleep();
  if(current==='exercise') main.innerHTML=renderExercise();
  if(current==='period') main.innerHTML=renderPeriod();
  if(current==='stats') main.innerHTML=renderStats();
  bindDynamic();
}
function renderHome(){
  return `<section class="hero"><h2>选择要记录的内容</h2><p>主页有五个入口。所有记录都保存在当前浏览器，可导出备份。</p></section>
  <section class="home-grid">
    ${cardEntry('water','💧','喝水','记录每次喝水 ml，设置每日目标，查看完成率。')}
    ${cardEntry('sleep','🌙','睡眠','记录睡眠时长和睡眠质量，观察每周平均。')}
    ${cardEntry('exercise','⛰️','运动','记录爬坡、散步、拉伸、跑步和运动时长。')}
    ${cardEntry('period','🌸','周期','日历记录经期起始点、头疼、睡眠差和备注。')}
    ${cardEntry('stats','📊','统计','按周、月、季度、年查看喝水、睡眠、运动、周期。')}
  </section>`;
}
function cardEntry(id,icon,title,desc){return `<button class="entry ${id}" onclick="showPage('${id}')"><div class="icon">${icon}</div><h3>${title}</h3><p>${desc}</p></button>`}

function renderWater(){
  const t=today();
  const todayTotal=data.water.filter(x=>x.time.slice(0,10)===t).reduce((s,x)=>s+x.ml,0);
  const goal=data.settings.waterGoal||2000;
  const pct=goal?Math.min(100,Math.round(todayTotal/goal*100)):0;
  const recent=[...data.water].slice(-8).reverse();
  return `<section class="hero"><h2>喝水记录</h2><p>记录每次喝水量，只使用 ml。可设置每日目标。</p></section>
  <section class="summary-grid">
    ${summary('今日喝水',todayTotal+' ml')}
    ${summary('今日目标',goal+' ml')}
    ${summary('完成率',pct+'%')}
  </section>
  <section class="card">
    <div class="card-title"><h3>记录喝水</h3><span class="muted">只用 ml</span></div>
    <div class="form-grid">
      <div class="field"><label>喝水量（ml）</label><input class="input" id="waterMl" type="number" min="0" step="50" placeholder="例如 300"></div>
      <div class="field"><label>记录时间</label><input class="input" id="waterTime" type="datetime-local" value="${timeKey()}"></div>
    </div>
    <div class="chips" style="margin-bottom:12px">
      ${[200,300,500,800].map(n=>`<button class="chip" onclick="document.getElementById('waterMl').value=${n}">${n} ml</button>`).join('')}
    </div>
    <div class="field"><label>备注（可选）</label><input class="input" id="waterNote" placeholder="例如：运动后补水"></div>
    <button class="btn" onclick="addWater()">保存喝水记录</button>
  </section>
  <section class="card">
    <div class="card-title"><h3>喝水目标</h3></div>
    <div class="form-grid">
      <input class="input" id="waterGoal" type="number" min="0" step="50" value="${goal}">
      <button class="btn secondary" onclick="saveWaterGoal()">保存目标</button>
    </div>
  </section>
  ${recordCard('最近喝水',recent.map(x=>record('water',x,`${x.ml} ml`,`${fmtDate(x.time)} ${x.time.slice(11,16)} ${esc(x.note||'')}`)).join(''))}`;
}
function renderSleep(){
  const recent=[...data.sleep].sort((a,b)=>b.date.localeCompare(a.date));
  const latest=recent[0];
  const avg=recent.slice(0,7).length?(recent.slice(0,7).reduce((s,x)=>s+x.quality,0)/recent.slice(0,7).length).toFixed(1):'—';
  return `<section class="hero"><h2>睡眠记录</h2><p>记录睡眠时长、质量和备注。</p></section>
  <section class="summary-grid">
    ${summary('最近睡眠',latest?latest.hours+' 小时':'—')}
    ${summary('最近质量',latest?qualityText(latest.quality):'—')}
    ${summary('平均质量',avg==='—'?'—':avg+'/5')}
  </section>
  <section class="card">
    <div class="card-title"><h3>记录睡眠</h3></div>
    <div class="form-grid">
      <div class="field"><label>睡眠日期</label><input class="input" id="sleepDate" type="date" value="${today()}"></div>
      <div class="field"><label>睡眠时长（小时）</label><input class="input" id="sleepHours" type="number" min="0" max="24" step="0.1" placeholder="例如 7.5"></div>
    </div>
    <div class="field"><label>睡眠质量</label><div class="chips" id="qualityChips">${[5,4,3,2,1].map(n=>`<button class="chip ${n===3?'active':''}" data-quality="${n}">${'⭐'.repeat(Math.min(n,3))} ${qualityText(n)}</button>`).join('')}</div></div>
    <div class="field"><label>备注（可选）</label><input class="input" id="sleepNote" placeholder="例如：中途醒了一次"></div>
    <button class="btn" onclick="addSleep()">保存睡眠记录</button>
  </section>
  ${recordCard('最近睡眠',recent.slice(0,8).map(x=>record('sleep',x,`${x.hours} 小时 · ${qualityText(x.quality)}`,`${fmtDate(x.date)} ${esc(x.note||'')}`)).join(''))}`;
}
function renderExercise(){
  const t=today();
  const todayTotal=data.exercise.filter(x=>x.time.slice(0,10)===t).reduce((s,x)=>s+x.minutes,0);
  const weekStart=startOfWeek(new Date()), weekEnd=addDays(weekStart,6);
  const weekTotal=data.exercise.filter(x=>betweenKey(x.time,weekStart,weekEnd)).reduce((s,x)=>s+x.minutes,0);
  const recent=[...data.exercise].slice(-8).reverse();
  return `<section class="hero"><h2>运动记录</h2><p>运动类型顺序：爬坡、散步、拉伸、跑步。</p></section>
  <section class="summary-grid">
    ${summary('今天运动',todayTotal+' 分钟')}
    ${summary('本周运动',weekTotal+' 分钟')}
    ${summary('记录次数',data.exercise.length+' 次')}
  </section>
  <section class="card">
    <div class="card-title"><h3>记录运动</h3></div>
    <div class="field"><label>运动类型</label><div class="chips" id="exerciseChips">${exerciseTypes.map((x,i)=>`<button class="chip ${i===0?'active':''}" data-type="${x}">${x}</button>`).join('')}</div></div>
    <div class="form-grid">
      <div class="field"><label>运动时长（分钟）</label><input class="input" id="exerciseMinutes" type="number" min="1" step="1" placeholder="例如 30"></div>
      <div class="field"><label>记录时间</label><input class="input" id="exerciseTime" type="datetime-local" value="${timeKey()}"></div>
    </div>
    <div class="field"><label>备注（可选）</label><input class="input" id="exerciseNote" placeholder="例如：饭后散步"></div>
    <button class="btn" onclick="addExercise()">保存运动记录</button>
  </section>
  ${recordCard('最近运动',recent.map(x=>record('exercise',x,`${x.type} · ${x.minutes} 分钟`,`${fmtDate(x.time)} ${x.time.slice(11,16)} ${esc(x.note||'')}`)).join(''))}`;
}
function renderPeriod(){
  const starts=data.period.filter(x=>x.isStart).sort((a,b)=>a.date.localeCompare(b.date));
  const last=starts.at(-1);
  const prev=starts.at(-2);
  const gap=last&&prev?Math.round((parseDate(last.date)-parseDate(prev.date))/86400000):'—';
  return `<section class="hero"><h2>周期日历</h2><p>点击日期记录经期起始点、头疼、睡眠差和备注。</p></section>
  <section class="summary-grid">
    ${summary('最近开始',last?fmtDate(last.date):'—')}
    ${summary('本次间隔',gap==='—'?'—':gap+' 天')}
    ${summary('周期记录',data.period.length+' 条')}
  </section>
  <section class="card">
    <div class="calendar-head">
      <button class="btn secondary small" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="btn secondary small" onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="calendar" id="calendar"></div>
  </section>
  ${recordCard('最近周期',starts.slice(-8).reverse().map(x=>record('period',x,fmtDate(x.date)+' · 经期起始点',`${esc(x.note||'')}`)).join(''))}`;
}
function renderStats(){
  const [start,end,label]=rangeBounds();
  const water=data.water.filter(x=>betweenKey(x.time,start,end));
  const sleep=data.sleep.filter(x=>betweenKey(x.date,start,end));
  const exercise=data.exercise.filter(x=>betweenKey(x.time,start,end));
  const period=data.period.filter(x=>betweenKey(x.date,start,end));
  const waterTotal=water.reduce((s,x)=>s+x.ml,0);
  const exerciseTotal=exercise.reduce((s,x)=>s+x.minutes,0);
  const sleepAvg=sleep.length?(sleep.reduce((s,x)=>s+x.hours,0)/sleep.length).toFixed(1):'—';
  return `<section class="hero"><h2>统计汇总</h2><p>按周、月、季度、年查看趋势。</p></section>
  <section class="card">
    <div class="card-title"><h3>统计范围</h3><span class="muted">${label}</span></div>
    <div class="chips" style="margin-bottom:12px">${['week','month','quarter','year'].map(k=>`<button class="chip ${statRange===k?'active':''}" onclick="setRange('${k}')">${rangeName(k)}</button>`).join('')}</div>
    <div class="chips"><button class="btn secondary small" onclick="shiftRange(-1)">上一段</button><button class="btn secondary small" onclick="statCursor=new Date();render()">回到当前</button><button class="btn secondary small" onclick="shiftRange(1)">下一段</button></div>
  </section>
  <section class="summary-grid">
    ${summary('喝水总量',waterTotal+' ml')}
    ${summary('运动总时长',exerciseTotal+' 分钟')}
    ${summary('平均睡眠',sleepAvg==='—'?'—':sleepAvg+' 小时')}
    ${summary('周期记录',period.length+' 条')}
  </section>
  <section class="chart-grid">
    ${barChart('喝水趋势（ml）',makeDaily(start,end,water,'ml'))}
    ${barChart('运动趋势（分钟）',makeDaily(start,end,exercise,'minutes'))}
    ${lineList('睡眠记录',sleep.map(x=>[x.date,x.hours+' 小时',Math.min(100,x.hours/10*100)]))}
    ${lineList('运动类型',exerciseTypes.map(t=>[t, exercise.filter(x=>x.type===t).reduce((s,x)=>s+x.minutes,0)+' 分钟', Math.min(100,exercise.filter(x=>x.type===t).reduce((s,x)=>s+x.minutes,0)/300*100)]))}
  </section>`;
}

function summary(label,value){return `<div class="summary"><span>${label}</span><strong>${value}</strong></div>`}
function recordCard(title,html){return `<section class="card"><div class="card-title"><h3>${title}</h3></div><div class="record-list">${html||'<div class="record"><div><b>还没有记录</b><small>从上面的表单开始记录吧</small></div></div>'}</div></section>`}
function record(type,x,title,sub){return `<div class="record"><div><b>${title}</b><small>${sub}</small></div><button class="btn danger small" onclick="removeItem('${type}','${x.id}')">删除</button></div>`}
function qualityText(n){return ({5:'很好',4:'良好',3:'一般',2:'较差',1:'很差'})[Number(n)]||'一般'}
function bindDynamic(){
  document.querySelectorAll('#qualityChips .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#qualityChips .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
  document.querySelectorAll('#exerciseChips .chip').forEach(b=>b.onclick=()=>{selectedExerciseType=b.dataset.type;document.querySelectorAll('#exerciseChips .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
  if(current==='period')renderCalendar();
}
function addWater(){const ml=Math.round(Number(document.getElementById('waterMl').value));if(!ml)return alert('请输入喝水量');data.water.push({id:uid(),ml,time:document.getElementById('waterTime').value||timeKey(),note:document.getElementById('waterNote').value.trim()});saveData();render()}
function saveWaterGoal(){const goal=Math.round(Number(document.getElementById('waterGoal').value));if(!goal)return alert('请输入目标');data.settings.waterGoal=goal;saveData();render()}
function addSleep(){const hours=Number(document.getElementById('sleepHours').value);if(!hours)return alert('请输入睡眠时长');const q=document.querySelector('#qualityChips .chip.active')?.dataset.quality||3;data.sleep.push({id:uid(),date:document.getElementById('sleepDate').value||today(),hours,quality:Number(q),note:document.getElementById('sleepNote').value.trim()});saveData();render()}
function addExercise(){const minutes=Math.round(Number(document.getElementById('exerciseMinutes').value));if(!minutes)return alert('请输入运动时长');data.exercise.push({id:uid(),type:selectedExerciseType,minutes,time:document.getElementById('exerciseTime').value||timeKey(),note:document.getElementById('exerciseNote').value.trim()});saveData();render()}
function removeItem(type,id){data[type]=data[type].filter(x=>x.id!==id);saveData();render()}

function renderCalendar(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  document.getElementById('monthTitle').textContent=`${y}年${m+1}月`;
  const cal=document.getElementById('calendar');cal.innerHTML='';
  const first=new Date(y,m,1), total=new Date(y,m+1,0).getDate(), blanks=(first.getDay()+6)%7;
  for(let i=0;i<blanks;i++)cal.insertAdjacentHTML('beforeend','<button class="day blank"></button>');
  for(let d=1;d<=total;d++){
    const key=dateKey(new Date(y,m,d)); const e=data.period.find(x=>x.date===key);
    const dots=e?`<div class="dots">${e.isStart?'<span class="dot"></span>':''}${(e.tags||[]).includes('头疼')?'<span class="dot head"></span>':''}${(e.tags||[]).includes('睡眠差')?'<span class="dot sleepbad"></span>':''}</div>`:'';
    cal.insertAdjacentHTML('beforeend',`<button class="day ${key===today()?'today':''} ${e?'has':''}" onclick="openPeriod('${key}')">${d}${dots}</button>`);
  }
}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);renderCalendar()}
function openPeriod(date){
  selectedPeriodDate=date;
  const e=data.period.find(x=>x.date===date)||{date,isStart:false,tags:[],note:''};
  openModal('记录 '+fmtDate(date), `<div class="field"><label><input type="checkbox" id="pStart" ${e.isStart?'checked':''}> 经期起始点</label></div>
    <div class="field"><label><input type="checkbox" id="pHead" ${(e.tags||[]).includes('头疼')?'checked':''}> 头疼</label></div>
    <div class="field"><label><input type="checkbox" id="pSleepBad" ${(e.tags||[]).includes('睡眠差')?'checked':''}> 睡眠差</label></div>
    <div class="field"><label>备注（可选）</label><textarea id="pNote">${esc(e.note||'')}</textarea></div>
    <button class="btn" onclick="savePeriod()">保存周期记录</button>
    <button class="btn danger" style="margin-top:10px" onclick="deletePeriod()">删除这天记录</button>`);
}
function savePeriod(){
  const tags=[]; if(document.getElementById('pHead').checked)tags.push('头疼'); if(document.getElementById('pSleepBad').checked)tags.push('睡眠差');
  const item={id:uid(),date:selectedPeriodDate,isStart:document.getElementById('pStart').checked,tags,note:document.getElementById('pNote').value.trim()};
  data.period=data.period.filter(x=>x.date!==selectedPeriodDate); if(item.isStart||tags.length||item.note)data.period.push(item);
  data.period.sort((a,b)=>a.date.localeCompare(b.date)); saveData(); closeModal(); render();
}
function deletePeriod(){data.period=data.period.filter(x=>x.date!==selectedPeriodDate);saveData();closeModal();render()}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('active')}
function closeModal(){document.getElementById('modal').classList.remove('active')}
function openBackup(){openModal('备份与恢复',`<p class="notice">数据保存在当前手机/浏览器里。建议定期导出备份，避免清理 Safari 数据后丢失。</p><div class="chips"><button class="btn" onclick="exportData()">导出备份文件</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">导入备份文件</button></div>`)}

function rangeName(k){return {week:'周',month:'月',quarter:'季度',year:'年'}[k]}
function setRange(k){statRange=k;statCursor=new Date();render()}
function shiftRange(n){if(statRange==='week')statCursor=addDays(statCursor,n*7);if(statRange==='month')statCursor.setMonth(statCursor.getMonth()+n);if(statRange==='quarter')statCursor.setMonth(statCursor.getMonth()+n*3);if(statRange==='year')statCursor.setFullYear(statCursor.getFullYear()+n);render()}
function makeDaily(start,end,arr,key){const days=[];for(let d=new Date(start);d<=end&&days.length<31;d=addDays(d,1)){const k=dateKey(d);days.push([String(d.getDate()),arr.filter(x=>(x.time||x.date).slice(0,10)===k).reduce((s,x)=>s+Number(x[key]||0),0)])}return days}
function barChart(title,values){const max=Math.max(1,...values.map(x=>x[1]));return `<div class="chart-card"><div class="chart-title"><b>${title}</b><span>${values.length} 天</span></div><div class="bar-chart">${values.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(3,x[1]/max*100)}%"></div><div class="bar-label">${x[0]}</div></div>`).join('')}</div></div>`}
function lineList(title,values){return `<div class="chart-card"><div class="chart-title"><b>${title}</b><span>${values.length} 条</span></div><div class="line-list">${values.length?values.map(x=>`<div class="line-item"><span>${x[0]}</span><div class="progress"><i style="width:${Math.max(3,x[2])}%"></i></div><b>${x[1]}</b></div>`).join(''):'<div class="muted">暂无数据</div>'}</div></div>`}

function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='玥玥作息备份_'+today()+'.json';a.click()}
function importData(e){const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{data={...defaultData(),...JSON.parse(r.result)};saveData();render();alert('导入成功')}catch(err){alert('文件格式不对')}}; r.readAsText(f); e.target.value=''}
init();
</script>
</body>
</html>
